random_state: 123
training_condition: real_only

cross_validation:
  method: repeated_stratified_kfold
  n_splits: 5
  n_repeats: 3
  shuffle: true

search:
  method: randomized_search
  primary_metric: balanced_accuracy
  secondary_metrics:
    - roc_auc
    - sensitivity
    - specificity
    - precision
    - f1
  n_jobs: 1
  return_train_score: false

algorithms:
  logistic_regression:
    n_iter: 14
    scale_numeric: true
    estimator:
      solver: lbfgs
      max_iter: 2000
    parameters:
      model__C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
      model__class_weight: [null, balanced]

  svm:
    n_iter: 20
    scale_numeric: true
    estimator:
      kernel: rbf
    parameters:
      model__C: [0.01, 0.1, 1.0, 10.0, 100.0]
      model__gamma: [scale, 0.001, 0.01, 0.1, 1.0]
      model__class_weight: [null, balanced]

  decision_tree:
    n_iter: 20
    scale_numeric: false
    estimator: {}
    parameters:
      model__criterion: [gini, entropy]
      model__max_depth: [null, 2, 3, 4, 5, 6]
      model__min_samples_split: [2, 5, 10, 20]
      model__min_samples_leaf: [1, 2, 4, 8]
      model__max_features: [null, sqrt, log2]
      model__class_weight: [null, balanced]

  random_forest:
    n_iter: 20
    scale_numeric: false
    estimator:
      n_jobs: 1
    parameters:
      model__n_estimators: [200, 400, 600]
      model__max_depth: [null, 2, 3, 4, 5, 6]
      model__min_samples_split: [2, 5, 10, 20]
      model__min_samples_leaf: [1, 2, 4, 8]
      model__max_features: [sqrt, log2, 0.5]
      model__class_weight: [null, balanced, balanced_subsample]

  xgboost:
    required_version: 3.4.0
    n_iter: 25
    scale_numeric: false
    estimator:
      objective: binary:logistic
      eval_metric: logloss
      tree_method: hist
      n_jobs: 1
      verbosity: 0
    parameters:
      model__n_estimators: [100, 200, 300, 400]
      model__max_depth: [2, 3, 4, 5]
      model__learning_rate: [0.01, 0.03, 0.05, 0.1]
      model__subsample: [0.6, 0.8, 1.0]
      model__colsample_bytree: [0.6, 0.8, 1.0]
      model__min_child_weight: [1, 3, 5]
      model__reg_alpha: [0.0, 0.01, 0.1, 1.0]
      model__reg_lambda: [0.1, 1.0, 10.0]
